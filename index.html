<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRAK!</title>
<meta name="description" content="Storyboard comics: capture ideas, plan beats, sketch panels, lay out pages.">
<meta name="theme-color" content="#1A1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KRAK!">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#F3EFE6; --surface:#FFFDF8; --surface2:#E9E3D6; --ink:#1A1714; --muted:#6A6258;
  --line:#D5CDBE; --accent:#C8321E; --accent-ink:#FFFFFF; --accent-soft:#F6DCD5; --pop:#F2C230; --danger:#A3291A;
  --paper:#FFFFFF; --radius:10px;
  --ui:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141210; --surface:#1E1B18; --surface2:#2A2622; --ink:#EEE8DD; --muted:#A79E91;
    --line:#3A352F; --accent:#EF6A52; --accent-ink:#1A0804; --accent-soft:#45221B; --pop:#F2C230; --danger:#F08070;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141210; --surface:#1E1B18; --surface2:#2A2622; --ink:#EEE8DD; --muted:#A79E91;
  --line:#3A352F; --accent:#EF6A52; --accent-ink:#1A0804; --accent-soft:#45221B; --pop:#F2C230; --danger:#F08070;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{background:var(--bg); color:var(--ink); font:15px/1.45 var(--ui); -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
[hidden]{display:none !important}
.app{max-width:1240px; margin:0 auto; padding-inline:16px; padding-block:10px 96px}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:4px 12px}
.brand{font-weight:900; font-style:italic; font-size:26px; letter-spacing:.02em; margin:0; line-height:1}
.brand span{color:var(--accent)}
h2{font-size:18px; margin:0; font-weight:800}
h3{font-size:12px; margin:0; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.stack{display:flex; flex-direction:column; gap:12px}
.btn{appearance:none; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:8px 13px; cursor:pointer; font-weight:600; line-height:1.2; white-space:nowrap; min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.field:focus-visible,.card:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.ghost{background:transparent; border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--danger)}
.btn.small{padding:5px 9px; font-size:13px; min-height:32px}
.btn.on{background:var(--accent-soft); border-color:var(--accent)}
.btn:disabled{opacity:.4; cursor:default}
.field{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:9px 11px}
textarea.field{resize:vertical; min-height:90px}
label.lbl{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px}
.empty{padding:28px 16px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:var(--radius)}

/* bottom nav (narrow screens) */
.nav{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line);
  display:flex; justify-content:center; gap:4px; padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px)); z-index:20}
.nav button{flex:0 1 150px; border:0; background:transparent; padding:9px 6px; border-radius:8px; cursor:pointer; font-weight:700; color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink); background:var(--surface2)}
.nav .badge{display:inline-block; min-width:18px; padding:0 5px; margin-left:4px; border-radius:9px; background:var(--accent); color:var(--accent-ink); font-size:11px; line-height:18px}

/* capture */
.cap-tools{display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding-bottom:8px}
.cap-tools .sep{width:1px; height:24px; background:var(--line); margin-inline:2px}
.swatch{width:30px; height:30px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0}
.swatch.on{border-color:var(--ink); box-shadow:0 0 0 2px var(--surface) inset}
.stage{position:relative; display:flex; align-items:center; justify-content:center; height:calc(100dvh - 190px); min-height:280px}
.sheet{position:relative; background:var(--paper); border:2px solid var(--ink); border-radius:4px; box-shadow:4px 4px 0 var(--ink); overflow:hidden}
.sheet canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.sheet canvas.ink{touch-action:none; cursor:crosshair}
.cap-more{padding-top:18px}
.photo-row{display:flex; gap:10px; align-items:center}
.photo-thumb{width:64px; height:64px; object-fit:cover; border-radius:6px; border:1px solid var(--line)}

/* inbox */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer; text-align:left; padding:0; display:flex; flex-direction:column}
.card:hover{border-color:var(--muted)}
.card .thumb{aspect-ratio:4/3; background:var(--paper); display:flex; align-items:center; justify-content:center; overflow:hidden; border-bottom:1px solid var(--line)}
.card .thumb img{width:100%; height:100%; object-fit:contain}
.card .thumb .txt{padding:10px; font-size:13px; color:#1A1714; overflow:hidden; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; white-space:pre-wrap}
.card .meta{padding:7px 10px; font-size:12px; color:var(--muted)}
.card .meta .t{color:var(--ink); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* projects */
.plist{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px}
.card.pcard{flex-direction:row; gap:12px; align-items:center; padding:12px}
.pshape{flex:0 0 auto; width:54px; height:70px; display:flex; align-items:center; justify-content:center}
.pshape i{display:block; background:var(--paper); border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink)}
.pcard .info{min-width:0}
.pcard .name{font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* wide layout: projects + inbox sidebar */
.split{display:grid; grid-template-columns:1fr; gap:20px}
@media (min-width:900px){
  .split.wide{grid-template-columns:minmax(0,1fr) 320px}
  .split.wide .side{border-left:1px solid var(--line); padding-left:20px}
  .side .grid{grid-template-columns:repeat(2,1fr)}
}

/* dialogs */
dialog{border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); padding:0; width:min(560px, calc(100vw - 32px)); max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(10,8,6,.55)}
.dlg{padding:18px; display:flex; flex-direction:column; gap:14px}
.dlg .big{background:var(--paper); border:1px solid var(--line); border-radius:6px; display:flex; justify-content:center}
.dlg .big img{max-width:100%; max-height:55dvh; display:block}
.dlg .note{white-space:pre-wrap; background:var(--surface2); border-radius:8px; padding:10px 12px}
.sizes{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
.size{border:1px solid var(--line); border-radius:8px; padding:9px 10px; cursor:pointer; background:var(--surface); text-align:left}
.size.on{border-color:var(--accent); background:var(--accent-soft)}
.size b{display:block; font-size:14px}
.size span{font-size:12px; color:var(--muted)}

.toast{position:fixed; left:50%; bottom:84px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:20px; font-weight:600; z-index:50; pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand">KRAK<span>!</span></h1>
    <div class="row" id="topActions"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="nav" id="nav" aria-label="Sections"></nav>
<dialog id="dlg"></dialog>
<script src="app.js"></script>
</body>
</html>
